PDN_CORE_RING_HSPACING: 2.0
PDN_CORE_RING_VOFFSET: 2.0
PDN_CORE_RING_HOFFSET: 2.0

# Metal4 PDN vertical stripe settings (thin metal, 0.45um)
FP_PDN_VWIDTH:    1.0
FP_PDN_VSPACING:  2.0
FP_PDN_VPITCH:   50.0
FP_PDN_VOFFSET:  30.52

# TopMetal1 PDN horizontal stripe settings (thick metal, 2um)
FP_PDN_HWIDTH:    2.0
FP_PDN_HSPACING:  4.0
FP_PDN_HPITCH:   46.03
FP_PDN_HOFFSET:   6.38

