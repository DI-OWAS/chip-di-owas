# Synthesis stuff
SYNTH_STRATEGY: "DEFAULT"

SYNTH_KEEP_HIERARCHY_MIN_COST: 3000
SYNTH_KEEP_HIERARCHY_MODULES:
- "core_complex_wrapper"
- "dc_cam_if_top"
- "BHsensorIF"
- "psram_controller_axi"
- "cryptoCore"
#- "eFPGA"

# this seems required for error-free yosys logs
#SYNTH_ABC_DFF: True

SYNTH_SIZING: True

SYNTH_MAX_FANOUT: 16
MAX_FANOUT_CONSTRAINT: 16

DESIGN_REPAIR_REMOVE_BUFFERS: true
DESIGN_REPAIR_MAX_SLEW_PCT: 30
DESIGN_REPAIR_MAX_CAP_PCT: 30
DESIGN_REPAIR_MAX_WIRE_LENGTH: 1000

# Floorplanning
FP_SIZING: absolute
DIE_AREA:  [   0.00,    0.00, 6000.00, 7000.00 ]
CORE_AREA: [ 346.08,  359.10, 5653.92, 6637.68 ]

