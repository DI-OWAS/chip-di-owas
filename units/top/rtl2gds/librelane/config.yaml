meta:
  version: 2
  flow: Classic
  substituting_steps:
    # flow control test ...
    #Verilator.Lint: null
    Checker.LintTimingConstructs: null
    Checker.LintErrors: null
    Checker.LintWarnings: null
    #Yosys.JsonHeader: null
    
    ## use synthesis step with renamed escaped names:
    #Yosys.Synthesis: Yosys.SynthesisWithRenameUnescape
    
    ## re-write json header after renaming instances:
    #+Yosys.SynthesisWithRenameUnescape: Yosys.JsonHeader
    
    # Some warnings in the SoC
    # GL simulation is fine
    Checker.YosysSynthChecks: null
    
    # IO pads are used instead of pins
    +Odb.SetPowerConnections: OpenROAD.Padring
    OpenROAD.GlobalPlacementSkipIO: null
    OpenROAD.IOPlacement: null

    +OpenROAD.GeneratePDN: Custom.MacroPDNStubs
    +Custom.MacroPDNStubs: IHP.PadPowerStubs
    #+IHP.PadPDNConnect: Custom.MacroPDNStubs
    
    # actually after global placement - put here for better runtime of ll_steps target.
    #+Odb.WriteVerilogHeader: Custom.ReplaceBlockageWithSoft
    
    #OpenROAD.CTS: Custom.CustomCTS
    #+OpenROAD.CTS: Custom.MacroClockDelay
    
    # ECO diodes
    #+OpenROAD.GlobalRouting: Odb.InsertECODiodes
    
    # IHP uses cumulative antenna rules
    # which aren't supported in repair yet > unclear whether this is still true - ant check disabled for runtime
    #OpenROAD.RepairAntennas: null

    # !!! TEMPORARILY disable due to errors !!!
    #OpenROAD.IRDropReport: null
    
    # Add Seal Ring
    +Checker.XOR: KLayout.SealRing
    
    # Run Filler insertion
    # This is done manually for now
    +KLayout.SealRing: KLayout.Filler
    
    # We run KLayout minimal DRC afterwards
    Magic.StreamOut: null
    Magic.DRC: null
    Checker.MagicDRC: null
    KLayout.XOR: null
    Checker.XOR: null

    #Magic.SpiceExtraction: null
    #Netgen.LVS: null
    #Checker.LVS: null

    # we run KLayout LVS, CDL is needed as input
    #+Checker.IllegalOverlap: OpenROAD.WriteCDL
    #+OpenROAD.WriteCDL: KLayout.LVS

    #KLayout.DRC: null
    #Checker.KLayoutDRC: null
    
    # We use the LEFs without obstruction
    # later on for extraction
    # Magic.SpiceExtraction: null
    
    Magic.WriteLEF: null # writes empty lef
    Odb.CheckDesignAntennaProperties: null # requires LEF

    # Magic reports some overlaps
    # I think the padring has some overlapping cells
    # but the GDS looks alright
    #Checker.IllegalOverlap: null
        
    # Setup violations don't matter (for now)
    #Checker.SetupViolations: null
    #Checker.HoldViolations: null
    #Checker.MaxSlewViolations: null
    #Checker.MaxCapViolations: null

    # !!! TEMPORARILY disable timing optimizer after CTS; consumed too much mem !!!
    #OpenROAD.ResizerTimingPostCTS: null
    #OpenROAD.ResizerTimingPostGRT: null


