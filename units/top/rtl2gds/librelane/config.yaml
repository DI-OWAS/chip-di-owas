#- "--diag-source"

# Magic has an offset on the SRAMs
PRIMARY_GDSII_STREAMOUT_TOOL: klayout
## Save on file space by sharing same cells
# errored out: KLAYOUT_CONFLICT_RESOLUTION: SkipNewCell

# Bondpad is not yet included in the PDK
EXTRA_GDS:
- dir::ip/bondpad/bondpad_70x70_novias.gds

EXTRA_LEFS:
- dir::ip/bondpad/bondpad_70x70_novias.lef

#EXTRA_EXCLUDED_CELLS:
#- "*_buf_1"

LAYERS_RC:
  "*":
    Metal1: {res: 0.00084375, cap: 0.0001273}
    Metal2: {res: 0.000515, cap: 0.0001824}
    Metal3: {res: 0.000515, cap: 0.0001804}
    Metal4: {res: 0.000515, cap: 0.0001800}
    TopMetal1: {res: 0.0000128, cap: 0.0002051}

# SDC
